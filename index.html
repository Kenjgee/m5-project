<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Hub — The USA's most inclusive movie database</title>
<script src="https://kit.fontawesome.com/354a273861.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <nav class="nav container">
      <a href="index.html" class="logo">
        <img class="logo-img" src="assets/Movie Hub Logo.png" alt="Movie Hub logo" />
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link active">Home</a></li>
        <li><a href="movies.html" class="nav-link">Movies</a></li>
      </ul>
      <a href="#contact" class="btn btn-primary">CONTACT</a>
    </nav>
  </header>
  <main>
    <section class="banner">
      <div class="container banner-inner">
        <h1 class="banner-title">The USA's most inclusive movie database.</h1>
        <p class="banner-subtitle">FIND YOUR NEXT MOVIE WITH MOVIE HUB</p>
        <form class="search-bar" id="homeSearchForm" onsubmit="onSearchSubmit(event)">
          <input
            type="text"
            id="homeInput"
            class="search-input"
            placeholder="Search by Movie Title"
            oninput="onSearchChange(event)"
            autocomplete="off"
          />
          <button type="submit" class="search-btn" onclick="onSearchClick()" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass search-btn__icon"></i>
          </button>
        </form>
        <p class="search-feedback" role="status">Press Enter or click the search button.</p>
      </div>      
      <div class="film-strip" aria-hidden="true">
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-film"></i>
      </div>
    </section>
    <section class="contact container" id="contact">
      <h2 class="section-title">Contact Us</h2>
      <form class="contact-form" id="contactForm" onsubmit="onContactSubmit(event)">
        <input type="text" id="contactName" placeholder="Your name" required />
        <input type="email" id="contactEmail" placeholder="Your email" required />
        <textarea id="contactMessage" rows="4" placeholder="Your message" required></textarea>
        <button type="submit" class="btn btn-primary btn-lg">SEND MESSAGE</button>
        <p id="contactFeedback" class="search-feedback" role="status"></p>
      </form>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Movie Hub — class project.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
