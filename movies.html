<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Movies | Movie Hub</title>
  <script src="https://kit.fontawesome.com/354a273861.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="banner banner-movies">
  <img class="banner-photo" src="assets/theater.jpg" alt="" />
  <div class="banner-overlay"></div>
  <nav class="nav container">
      <a href="index.html" class="logo">
        <img class="logo-img" src="assets/Movie Hub Logo.png" alt="Movie Hub logo" />
      </a>
      <ul class="nav-links nav-links-light">
        <li><a href="index.html" class="nav-link-light">Home</a></li>
        <li><a href="movies.html" class="nav-link-light nav-link-underlined">Movies</a></li>
      </ul>
      <a href="index.html#contact" class="btn btn-light">CONTACT</a>
    </nav>
    <div class="container banner-movies-inner">
      <h1 class="banner-movies-title">Browse our movies</h1>
      <form class="search-bar" id="searchForm" onsubmit="onSearchSubmit(event)">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by Movie Title"
          oninput="onSearchChange(event)"
          autocomplete="off"
        />
        <button type="submit" class="search-btn" id="searchBtn" onclick="onSearchClick()" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass search-btn__icon"></i>
          <i class="fas fa-spinner search-btn__loading--spinner"></i>
        </button>
      </form>
    </div>
  </header>
  <main>
    <section class="results container">
      <div class="results-bar">
        <p class="results-count" id="resultsCount">Search results:</p>

        <div class="sort-filter">
          <label for="sortSelect" class="price-label">
            Sort by year: <span class="price-value">High to Low</span>
          </label>
          <select id="sortSelect" class="sort-select" onchange="onSortChange(event)">
            <option value="default">Default order</option>
            <option value="desc" selected>Year: High to Low</option>
            <option value="asc">Year: Low to High</option>
          </select>
        </div>
      </div>
      <div class="spinner" id="spinner" aria-label="Loading movies"></div>
      <div class="movie-grid" id="movieGrid"></div>
      <p id="noResults" class="no-results" hidden>No movies match your search. Try another title.</p>
      <p id="apiError" class="no-results" hidden>Could not reach the movie database. Check your connection and try again.</p>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Movie Hub — class project.</p>
    </div>
  </footer>
  <script src="movies.js"></script>  
</body>
</html>
